# Account Takeover Investigator (G4) runtime configuration.
#
# Loaded by `src/account_takeover_investigator/config.py`. Point at a different file with
# ATOINVEST_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY REFUSES at boot (an operator who emptied a value expressed an intent, and it
# names nothing, so it must not inherit the default and must not silently become the empty
# string either), and a set value wins. To take the default written here, UNSET the variable.
# This file holds env var NAMES and non-secret defaults only: no secret value is ever committed
# here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${ATOINVEST_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${ATOINVEST_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${ATOINVEST_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${ATOINVEST_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound ATOINVEST_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# Bank-owned fusion policy: the thresholds and per-signal weights the deterministic engine reads.
# These are the adopter's numbers, lifted out of engine code so a bank tunes them here without a
# code edit. Any key omitted keeps the engine default (see domain/policy.py). Illustrative only.
policy:
  base_score: 0.0
  device_change_uplift: 0.35
  impossible_travel_uplift: 0.50
  credential_stuffing_uplift: 0.30
  biometric_deviation_uplift: 0.25
  impossible_speed_kmh: 900.0
  min_travel_km: 50.0
  stuffing_window_minutes: 15
  stuffing_failure_threshold: 5
  biometric_threshold: 0.60
  critical_score: 0.80
  high_score: 0.50
  medium_score: 0.25

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: account_takeover_investigator.adapters.local.audit:LocalAuditAdapter
    gcp: account_takeover_investigator.adapters.gcp.audit:CloudAuditAdapter
    onprem: account_takeover_investigator.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: account_takeover_investigator.adapters.local.identity:LocalIdentityAdapter
    gcp: account_takeover_investigator.adapters.gcp.identity:IapIdentityAdapter
    onprem: account_takeover_investigator.adapters.onprem.identity:OnPremIdentityAdapter
  review_router:
    local: account_takeover_investigator.adapters.local.review_router:LocalReviewRouter
    gcp: account_takeover_investigator.adapters.gcp.review_router:CloudReviewRouter
    onprem: account_takeover_investigator.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the Hrz5 collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: account_takeover_investigator.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: account_takeover_investigator.adapters.gcp.tracer:CloudTracerAdapter
    onprem: account_takeover_investigator.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (Hrz4). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: account_takeover_investigator.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: account_takeover_investigator.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: account_takeover_investigator.adapters.onprem.evaluation:OnPremEvalAdapter
  sessions:
    local: account_takeover_investigator.adapters.local.sessions:LocalSessionAdapter
    gcp: account_takeover_investigator.adapters.gcp.sessions:CloudSessionAdapter
    onprem: account_takeover_investigator.adapters.onprem.sessions:OnPremSessionAdapter
  feature_store:
    local: account_takeover_investigator.adapters.local.feature_store:LocalFeatureStoreAdapter
    gcp: account_takeover_investigator.adapters.gcp.feature_store:CloudFeatureStoreAdapter
    onprem: account_takeover_investigator.adapters.onprem.feature_store:OnPremFeatureStoreAdapter
  iam_actions:
    local: account_takeover_investigator.adapters.local.iam_actions:LocalIamActionsAdapter
    gcp: account_takeover_investigator.adapters.gcp.iam_actions:CloudIamActionsAdapter
    onprem: account_takeover_investigator.adapters.onprem.iam_actions:OnPremIamActionsAdapter
  narrator:
    local: account_takeover_investigator.adapters.local.narrator:LocalNarratorAdapter
    gcp: account_takeover_investigator.adapters.gcp.narrator:CloudNarratorAdapter
    onprem: account_takeover_investigator.adapters.onprem.narrator:OnPremNarratorAdapter
